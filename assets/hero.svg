<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#070b10"/><stop offset=".55" stop-color="#0d1117"/><stop offset="1" stop-color="#06151a"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#00ADD8"/><stop offset=".5" stop-color="#58A6FF"/><stop offset="1" stop-color="#3FB950"/></linearGradient>
 <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30363d" opacity=".25"/></pattern>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/><rect width="1200" height="360" rx="18" fill="url(#grid)"/>
<g fill="none" stroke="url(#cyan)" stroke-width="2" opacity=".55">
 <path d="M-30 74H260L325 138H430" stroke-dasharray="14 12"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="3s" repeatCount="indefinite"/></path>
 <path d="M1230 74H940L875 138H770" stroke-dasharray="14 12"><animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3s" repeatCount="indefinite"/></path>
 <path d="M-30 285H260L325 222H430" stroke-dasharray="14 12"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="3.7s" repeatCount="indefinite"/></path>
 <path d="M1230 285H940L875 222H770" stroke-dasharray="14 12"><animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3.7s" repeatCount="indefinite"/></path>
</g>
<g fill="#00ADD8" filter="url(#g)">
